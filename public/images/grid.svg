<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!--
    Subtle grid overlay used behind the services section (opacity applied in CSS).
    This file was previously referenced by /services but was never committed,
    which left a live 404 on every request to that page.
    Uses the site's gold accent (#FFD700) at low alpha.
  -->
  <g stroke="#FFD700" stroke-width="1" fill="none" opacity="0.6">
    <path d="M0 0 H60 M0 30 H60 M0 60 H60" />
    <path d="M0 0 V60 M30 0 V60 M60 0 V60" />
  </g>
  <g fill="#FFD700" opacity="0.45">
    <circle cx="0" cy="0" r="1.6" />
    <circle cx="30" cy="0" r="1.6" />
    <circle cx="60" cy="0" r="1.6" />
    <circle cx="0" cy="30" r="1.6" />
    <circle cx="30" cy="30" r="1.6" />
    <circle cx="60" cy="30" r="1.6" />
    <circle cx="0" cy="60" r="1.6" />
    <circle cx="30" cy="60" r="1.6" />
    <circle cx="60" cy="60" r="1.6" />
  </g>
</svg>
