<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #05070d;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .photo {
    position: absolute; inset: 0;
    background-image: url("FILE:///Users/shareefali/clawd/podcast/public/images/services/1.jpg");
    background-size: cover;
    background-position: center 42%;
    filter: saturate(0.85);
  }
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(5,7,13,0.96) 0%, rgba(5,7,13,0.88) 42%, rgba(5,7,13,0.55) 72%, rgba(5,7,13,0.42) 100%),
      linear-gradient(0deg, rgba(5,7,13,0.92) 0%, rgba(5,7,13,0.15) 55%, rgba(5,7,13,0.55) 100%);
  }
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 76px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 20px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
    color: #FFD700; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 10px; height: 10px; border-radius: 50%; background: #FFD700; }
  h1 {
    font-size: 68px; line-height: 1.06; font-weight: 800; color: #ffffff;
    letter-spacing: -1.5px; max-width: 780px;
    text-shadow: 0 3px 26px rgba(0,0,0,0.75);
  }
  h1 .accent { color: #FFD700; }
  .sub {
    margin-top: 24px; font-size: 27px; line-height: 1.4; color: #d8dde6;
    max-width: 700px; font-weight: 400;
  }
  .rule { width: 96px; height: 4px; background: #FFD700; margin: 30px 0 24px; border-radius: 2px; }
  .brand {
    font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: 0.4px;
  }
  .brand span { color: #FFD700; }
  .foot {
    position: absolute; right: 56px; bottom: 40px;
    font-size: 21px; color: rgba(255,255,255,0.82); font-weight: 600;
    background: rgba(5,7,13,0.55); border: 1px solid rgba(255,215,0,0.35);
    padding: 12px 24px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="content">
    <div class="eyebrow"><span class="dot"></span>Bahrain</div>
    <h1>Podcast <span class="accent">Production</span> in Bahrain</h1>
    <div class="rule"></div>
    <div class="sub">Cinema-quality multi-camera setups. A mobile studio that comes to you. Your episode back in 12 hours.</div>
    <div class="brand" style="margin-top:30px;">by <span>Premiera Live</span></div>
  </div>
  <div class="foot">podcastbahrain.com</div>
</body>
</html>
